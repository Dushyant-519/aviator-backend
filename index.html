<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Pro - Dynamic QR & Processing Queue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f1215; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .game-container { width: 100%; max-width: 480px; background: #181c20; border-radius: 16px; border: 1px solid #2a2f35; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #2a2f35; }
    .title { font-size: 17px; font-weight: bold; color: #e74c3c; display: flex; align-items: center; gap: 6px; }
    
    .wallet-box { display: flex; align-items: center; gap: 6px; }
    .balance { background: #22272e; padding: 6px 10px; border-radius: 20px; font-weight: 600; color: #2ecc71; border: 1px solid #2c323a; font-size: 13px; }
    .wallet-btn { background: #3498db; color: white; border: none; padding: 6px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .wallet-btn:hover { background: #2980b9; }

    .canvas-container { position: relative; width: 100%; height: 220px; background: #121518; border-radius: 12px; overflow: hidden; border: 1px solid #22272d; margin-bottom: 15px; }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); }
    .multiplier { font-size: 48px; font-weight: 800; color: #ffffff; text-shadow: 0 0 20px rgba(46, 204, 113, 0.6); }
    .status-text { font-size: 16px; font-weight: 600; margin-top: 5px; }
    .status-waiting { color: #f39c12; }
    .status-crashed { color: #e74c3c; }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    .input-group { display: flex; gap: 10px; }
    .bet-input { flex: 1; background: #22272e; border: 1px solid #2c323a; border-radius: 8px; color: #fff; padding: 12px; font-size: 16px; font-weight: 600; outline: none; }
    .bet-input:focus { border-color: #3498db; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
    .btn-bet { background: #27ae60; color: white; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
    .btn-bet:hover { background: #219150; }
    .btn-cashout { background: #f39c12; color: white; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3); }
    .btn-cashout:hover { background: #d68910; }
    .btn-cancel { background: #c0392b; color: white; }
    .btn:disabled { background: #3a4149; color: #7f8c8d; cursor: not-allowed; box-shadow: none; }

    .history { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; margin-top: 12px; border-top: 1px solid #2a2f35; }
    .history-item { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: 600; background: #22272e; }
    .hist-high { color: #2ecc71; }
    .hist-low { color: #e74c3c; }

    /* Modal Styling */
    .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 18, 21, 0.96); z-index: 10; border-radius: 16px; padding: 20px; flex-direction: column; overflow-y: auto; }
    .modal h3 { margin-bottom: 12px; color: #3498db; font-size: 18px; }
    .modal input { width: 100%; background: #22272e; border: 1px solid #2c323a; border-radius: 8px; color: #fff; padding: 10px; font-size: 15px; margin-bottom: 12px; outline: none; }
    .modal-actions { display: flex; gap: 10px; margin-bottom: 15px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-confirm { background: #27ae60; color: white; }
    .btn-close { background: #7f8c8d; color: white; }
    
    .queue-section { margin-top: 10px; border-top: 1px solid #2a2f35; padding-top: 10px; }
    .queue-title { font-size: 14px; color: #f39c12; margin-bottom: 6px; }
    .queue-list { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .queue-item { background: #22272e; padding: 8px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c323a; }
    .status-processing { color: #f39c12; font-weight: bold; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="title">🚀 AVIATOR PRO</div>
    <div class="wallet-box">
      <div class="balance">🪙 <span id="balanceText">1000</span></div>
      <button class="wallet-btn" onclick="openModal('deposit')">Deposit</button>
      <button class="wallet-btn" onclick="openModal('withdraw')" style="background: #e67e22;">Withdraw</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay">
      <div id="multiplierDisplay" class="multiplier">1.00x</div>
      <div id="statusDisplay" class="status-text status-waiting">WAITING FOR NEXT ROUND</div>
    </div>
  </div>

  <div class="controls">
    <div class="input-group">
      <input type="number" id="betAmount" class="bet-input" value="50" min="10" step="10">
    </div>
    <button id="actionBtn" class="btn btn-bet">PLACE BET</button>
  </div>

  <div class="history" id="historyList"></div>

  <!-- Wallet & Deposit Modal with Dynamic QR -->
  <div id="walletModal" class="modal">
    <h3 id="modalTitle">Deposit Funds</h3>

    <!-- Dynamic QR Code Container -->
    <div id="qrContainer" style="text-align: center; margin-bottom: 12px; display: none;">
      <p style="font-size: 12px; color: #aaa; margin-bottom: 8px;">Scan & Pay via PhonePe / GPay / Paytm</p>
      <img id="upiQrImg" src="" alt="UPI QR Code" style="border-radius: 10px; border: 2px solid #27ae60; padding: 5px; background: #fff; width: 160px; height: 160px;" />
      <p style="font-size: 13px; font-weight: bold; color: #2ecc71; margin-top: 6px;">
        UPI ID: <span id="displayUpiId" style="color: #fff;">-</span>
      </p>
    </div>

    <input type="number" id="modalAmount" placeholder="Enter Amount (₹)" min="100">

    <!-- UTR Input for Deposit -->
    <div id="utrGroup" style="display: none;">
      <input type="text" id="utrNumber" placeholder="Enter 12-Digit UTR / Ref No.">
    </div>

    <!-- UPI Input for Withdrawal -->
    <div id="withdrawUpiGroup" style="display: none;">
      <input type="text" id="userWithdrawUpi" placeholder="Enter Your UPI ID (e.g. 9876543210@paytm)">
    </div>

    <div class="modal-actions">
      <button class="modal-btn btn-confirm" onclick="processWalletAction()">Submit</button>
      <button class="modal-btn btn-close" onclick="closeModal()">Close</button>
    </div>

    <div class="queue-section">
      <div class="queue-title">📋 Withdrawal Processing Queue</div>
      <div class="queue-list" id="queueList">
        <div style="color: #7f8c8d; font-size: 12px;">No pending withdrawals</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ================= CONFIGURATION =================
  const MY_UPI_ID = "7351524970@pytes"; // <-- Yahan apni UPI ID set karein
  const MY_NAME = "AviatorPro";
  const BACKEND_URL = "http://localhost:5000";
  // =================================================

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const balanceText = document.getElementById('balanceText');
  const multiplierDisplay = document.getElementById('multiplierDisplay');
  const statusDisplay = document.getElementById('statusDisplay');
  const actionBtn = document.getElementById('actionBtn');
  const betAmountInput = document.getElementById('betAmount');
  const historyList = document.getElementById('historyList');
  
  const walletModal = document.getElementById('walletModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalAmount = document.getElementById('modalAmount');
  const queueList = document.getElementById('queueList');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  resizeCanvas();

  let balance = 1000;
  let currentMultiplier = 1.00;
  let crashPoint = 1.00;
  let gameState = 'WAITING';
  let betPlaced = false;
  let cashedOut = false;
  let betAmount = 50;
  let animationFrame;
  let roundStartTime = 0;
  let activeModalType = '';
  let withdrawalQueue = [];

  function updateBalanceDisplay() {
    balanceText.innerText = balance;
  }

  function openModal(type) {
    activeModalType = type;
    modalTitle.innerText = type === 'deposit' ? 'Deposit Funds (Scan QR)' : 'Withdraw Cash (Queued)';
    modalAmount.value = '';

    const qrContainer = document.getElementById('qrContainer');
    const utrGroup = document.getElementById('utrGroup');
    const withdrawUpiGroup = document.getElementById('withdrawUpiGroup');
    const displayUpiId = document.getElementById('displayUpiId');
    const upiQrImg = document.getElementById('upiQrImg');

    if (type === 'deposit') {
      qrContainer.style.display = 'block';
      utrGroup.style.display = 'block';
      withdrawUpiGroup.style.display = 'none';

      displayUpiId.innerText = MY_UPI_ID;
      upiQrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=${MY_UPI_ID}&pn=${encodeURIComponent(MY_NAME)}&cu=INR`;
    } else {
      qrContainer.style.display = 'none';
      utrGroup.style.display = 'none';
      withdrawUpiGroup.style.display = 'block';
    }

    walletModal.style.display = 'flex';
    renderQueue();
  }

  function closeModal() {
    walletModal.style.display = 'none';
  }

  function renderQueue() {
    if (withdrawalQueue.length === 0) {
      queueList.innerHTML = `<div style="color: #7f8c8d; font-size: 12px;">No pending withdrawals</div>`;
      return;
    }
    queueList.innerHTML = '';
    withdrawalQueue.forEach((item) => {
      const div = document.createElement('div');
      div.className = 'queue-item';
      div.innerHTML = `
        <span>₹${item.amount} (${item.upi || 'UPI'})</span>
        <span class="status-processing">⏳ Processing...</span>
      `;
      queueList.appendChild(div);
    });
  }

  async function processWalletAction() {
    const amt = parseInt(modalAmount.value);
    if (isNaN(amt) || amt <= 0) {
      alert("Please enter a valid amount!");
      return;
    }

    if (activeModalType === 'deposit') {
      const utr = document.getElementById('utrNumber').value.trim();
      if (!utr || utr.length < 6) {
        alert("Please enter a valid UTR / Ref Number after paying via QR!");
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/request-deposit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'user_123', amount: amt, utrNumber: utr })
        });
        const data = await response.json();
        if (data.success) {
          alert(data.message);
          closeModal();
        }
      } catch (e) {
        alert(`Deposit Request of ₹${amt} (UTR: ${utr}) submitted!`);
        closeModal();
      }

    } else if (activeModalType === 'withdraw') {
      const userUpi = document.getElementById('userWithdrawUpi').value.trim();
      if (!userUpi) {
        alert("Please enter your UPI ID!");
        return;
      }
      if (amt > balance) {
        alert("Insufficient balance for withdrawal!");
        return;
      }

      balance -= amt;
      updateBalanceDisplay();

      try {
        const response = await fetch(`${BACKEND_URL}/api/withdraw`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'user_123', amount: amt, upiId: userUpi })
        });
        const data = await response.json();
        withdrawalQueue.push({ amount: amt, upi: userUpi });
        alert(data.message);
        renderQueue();
      } catch (e) {
        withdrawalQueue.push({ amount: amt, upi: userUpi });
        alert(`Withdrawal of ₹${amt} queued! Status: PROCESSING`);
        renderQueue();
      }
    }
  }

  function getProfitOptimizedCrashPoint() {
    const rand = Math.random();
    if (rand < 0.12) return 1.00; // 12% instant crash
    const crash = 1 + (Math.pow(rand, 2.2) * 8);
    return parseFloat(crash.toFixed(2));
  }

  function startWaitingPhase() {
    gameState = 'WAITING';
    currentMultiplier = 1.00;
    betPlaced = false;
    cashedOut = false;
    
    multiplierDisplay.innerText = "1.00x";
    multiplierDisplay.style.color = "#ffffff";
    statusDisplay.innerText = "NEXT ROUND IN 4s";
    statusDisplay.className = "status-text status-waiting";

    actionBtn.innerText = "PLACE BET";
    actionBtn.className = "btn btn-bet";
    actionBtn.disabled = false;
    betAmountInput.disabled = false;

    let countdown = 4;
    const timer = setInterval(() => {
      countdown--;
      if (gameState !== 'WAITING') {
        clearInterval(timer);
        return;
      }
      if (countdown > 0) {
        statusDisplay.innerText = `NEXT ROUND IN ${countdown}s`;
      } else {
        clearInterval(timer);
        startFlightPhase();
      }
    }, 1000);
  }

  function startFlightPhase() {
    gameState = 'RUNNING';
    crashPoint = getProfitOptimizedCrashPoint();
    roundStartTime = Date.now();

    if (betPlaced) {
      actionBtn.innerText = "CASHOUT (0)";
      actionBtn.className = "btn btn-cashout";
      actionBtn.disabled = false;
    } else {
      actionBtn.disabled = true;
      actionBtn.innerText = "ROUND STARTED";
    }

    betAmountInput.disabled = true;
    statusDisplay.innerText = "";

    gameLoop();
  }

  function gameLoop() {
    if (gameState !== 'RUNNING') return;

    const elapsedTime = (Date.now() - roundStartTime) / 1000;
    currentMultiplier = parseFloat((1 + Math.pow(elapsedTime, 1.7) * 0.12).toFixed(2));

    if (currentMultiplier >= crashPoint) {
      triggerCrash();
      return;
    }

    multiplierDisplay.innerText = currentMultiplier.toFixed(2) + "x";

    if (betPlaced && !cashedOut) {
      const currentWin = Math.floor(betAmount * currentMultiplier);
      actionBtn.innerText = `CASHOUT (${currentWin})`;
    }

    drawGraph(elapsedTime);
    animationFrame = requestAnimationFrame(gameLoop);
  }

  function triggerCrash() {
    gameState = 'CRASHED';
    cancelAnimationFrame(animationFrame);

    multiplierDisplay.innerText = currentMultiplier.toFixed(2) + "x";
    multiplierDisplay.style.color = "#e74c3c";
    statusDisplay.innerText = "FLEW AWAY!";
    statusDisplay.className = "status-text status-crashed";

    if (betPlaced && !cashedOut) {
      actionBtn.innerText = "CRASHED!";
      actionBtn.className = "btn btn-bet";
      actionBtn.disabled = true;
    }

    addHistory(currentMultiplier);
    drawCrashGraph();

    setTimeout(() => {
      startWaitingPhase();
    }, 3000);
  }

  function drawGraph(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const progress = Math.min(time / 8, 1);
    const startX = 20;
    const startY = canvas.height - 20;
    const endX = startX + (canvas.width - 60) * progress;
    const endY = startY - (canvas.height - 60) * progress;

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(endX / 2, startY, endX, endY);
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(endX, endY, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
  }

  function drawCrashGraph() {
    ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function addHistory(val) {
    const item = document.createElement('div');
    item.className = `history-item ${val >= 2.0 ? 'hist-high' : 'hist-low'}`;
    item.innerText = val.toFixed(2) + 'x';
    historyList.prepend(item);

    if (historyList.children.length > 8) {
      historyList.removeChild(historyList.lastChild);
    }
  }

  actionBtn.addEventListener('click', () => {
    if (gameState === 'WAITING') {
      if (!betPlaced) {
        const val = parseInt(betAmountInput.value);
        if (isNaN(val) || val <= 0 || val > balance) {
          alert("Invalid Bet Amount!");
          return;
        }
        betAmount = val;
        balance -= betAmount;
        updateBalanceDisplay();
        betPlaced = true;
        actionBtn.innerText = "CANCEL BET";
        actionBtn.className = "btn btn-cancel";
      } else {
        balance += betAmount;
        updateBalanceDisplay();
        betPlaced = false;
        actionBtn.innerText = "PLACE BET";
        actionBtn.className = "btn btn-bet";
      }
    } else if (gameState === 'RUNNING' && betPlaced && !cashedOut) {
      cashedOut = true;
      
      const rawWin = betAmount * currentMultiplier;
      const netWin = Math.floor(rawWin * 0.95); // 5% platform cut
      
      balance += netWin;
      updateBalanceDisplay();
      
      actionBtn.innerText = `WON 🪙 ${netWin}`;
      actionBtn.className = "btn btn-bet";
      actionBtn.disabled = true;
    }
  });

  startWaitingPhase();
</script>
</body>
</html>
